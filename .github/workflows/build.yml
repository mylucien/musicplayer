name: Build APK & AAB

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: 设置 Gradle 缓存
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug

      - name: 构建 Release APK (未签名)
        run: ./gradlew assembleRelease

      - name: 构建 Release AAB (未签名)
        run: ./gradlew bundleRelease

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMusicPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMusicPlayer-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: 上传 Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CarMusicPlayer-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

  # ========== 签名发布 (需要 GitHub Secrets) ==========
  sign-release:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 下载未签名 APK
        uses: actions/download-artifact@v4
        with:
          name: CarMusicPlayer-Release-APK
          path: app/build/outputs/apk/release/

      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          for apk in app/build/outputs/apk/release/*-release-unsigned.apk; do
            [ -f "$apk" ] || continue
            signed=${apk/-unsigned/-signed}
            jarsigner -verbose \
              -keystore keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -signedjar "$signed" \
              "$apk" "$KEY_ALIAS"
            # zipalign
            aligned=${signed/.apk/-aligned.apk}
            ${ANDROID_HOME}/build-tools/*/zipalign -v 4 "$signed" "$aligned"
          done

      - name: 上传已签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMusicPlayer-Signed-Release
          path: app/build/outputs/apk/release/*-aligned.apk
